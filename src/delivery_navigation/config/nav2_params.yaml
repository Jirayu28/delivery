amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0 #150.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: "/scan"
    map_topic: map
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: -4.0
      y: 13.5
      z: 0.0
      yaw: 1.57

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    transform_tolerance: 0.2
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: False  # ใช้เวลา /clock จาก simulation
                         # ถ้าใช้หุ่นจริงให้เปลี่ยนเป็น false

    controller_frequency: 20.0  # ความถี่ที่ controller server คำนวณคำสั่ง /cmd_vel
                                # 20 Hz = คำนวณ 20 ครั้งต่อวินาที

    min_x_velocity_threshold: 0.001      # ถ้าความเร็วแกน X จาก odom มีค่าน้อยกว่านี้
                                         # จะถูกมองว่าเป็น 0.0 เพื่อตัด noise เล็กๆ
                                         # X คือเดินหน้า/ถอยหลัง

    min_y_velocity_threshold: 0.5        # threshold ของแกน Y
                                         # สำหรับหุ่น differential มักไม่ได้ใช้การไถข้าง
                                         # เลยตั้งสูงไว้เพื่อตัดค่าแกน Y ทิ้งไปเลย

    min_theta_velocity_threshold: 0.001  # ถ้าความเร็วเชิงมุมจาก odom ต่ำกว่านี้
                                         # จะถือว่าไม่หมุน เพื่อตัด noise ตอนหยุดนิ่ง

    failure_tolerance: 0.3               # controller server ยอมให้มีความผิดพลาดชั่วคราว
                                         # ช่วงสั้นๆ ก่อนจะถือว่าล้มเหลว
                                         # ช่วยลดการ fail ทันทีจากอาการสะดุดสั้นๆ ของระบบ

    progress_checker_plugins: ["progress_checker"]  # รายชื่อ progress checker ที่จะใช้
    goal_checker_plugins: ["goal_checker"]          # รายชื่อ goal checker ที่จะใช้
    controller_plugins: ["FollowPath"]             # รายชื่อ controller plugin ที่จะใช้จริง

    # -----------------------------
    # Progress checker
    # -----------------------------
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"  # ตัวตรวจว่าหุ่นยัง "มีความคืบหน้า" อยู่ไหม

      required_movement_radius: 0.5   # หุ่นต้องขยับได้อย่างน้อย 0.5 m
                                      # จึงจะถือว่ามี progress

      movement_time_allowance: 10.0   # ถ้าภายใน 10 วินาที ขยับไม่ถึงระยะด้านบน
                                      # progress checker จะมองว่าหุ่นติด/ไม่คืบหน้า

    # -----------------------------
    # Goal checker
    # -----------------------------
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"  # ตัวตรวจว่าถึง goal แล้วหรือยัง

      xy_goal_tolerance: 0.25    # อนุญาตให้ตำแหน่งคลาดเคลื่อนจาก goal ได้ 0.25 m
                                 # ถ้าเข้าใกล้ในระยะนี้ถือว่าถึงในเชิงตำแหน่ง

      yaw_goal_tolerance: 0.25   # อนุญาตให้มุมคลาดเคลื่อนได้ 0.25 rad (~14.3 deg)
                                 # ถ้ามุมต่างจาก goal ไม่เกินนี้ถือว่าถึงในเชิงทิศทาง

      stateful: true             # เมื่อเข้าใกล้เป้าหมายแล้ว จะเช็ก goal แบบมี state
                                 # ช่วยให้การเช็ก goal ปลายทางนิ่งขึ้น

    # -----------------------------
    # Rotation Shim + RPP
    # -----------------------------
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      # Rotation Shim เป็นตัวครอบ controller หลักอีกที
      # หน้าที่คือ:
      # 1) ถ้าทิศหน้าหุ่นยังไม่ตรงแนว path มากพอ -> หมุนก่อน
      # 2) ถ้าตรงแนว path แล้ว -> ส่งงานให้ primary_controller ตาม path ต่อ

      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # controller หลักที่ใช้ตาม path หลังจาก shim จัด heading ให้แล้ว

      # -----------------------------
      # Rotation Shim settings
      # -----------------------------
      angular_dist_threshold: 0.174
      # threshold ของ "มุมต่าง" ระหว่างหน้าหุ่นกับทิศของ path
      # 0.174 rad ≈ 10 deg
      # ถ้ามุมต่างมากกว่านี้ -> shim จะเลือกหมุนในที่ก่อน
      # ถ้าน้อยกว่านี้ -> ส่งต่อให้ RPP ตาม path เลย
      # ค่านี้ยิ่งเล็ก ยิ่งเข้มงวดเรื่องต้องหันตรง path ก่อน

      forward_sampling_distance: 0.5
      # ระยะที่ใช้มองไปข้างหน้าบน path เพื่อประเมิน heading ของ path
      # ค่านี้มีผลกับทิศอ้างอิงที่ shim ใช้ตัดสินว่าจะต้องหมุนหรือยัง

      rotate_to_heading_angular_vel: 0.5
      # ความเร็วเชิงมุมตอน shim หมุนหุ่นเข้าหา path หรือ goal heading
      # ค่ายิ่งมาก -> หมุนเร็วขึ้น แต่เสี่ยง overshoot และแกว่งมากขึ้น
      # ของคุณตอนนี้ลดลงมาแล้ว ถือว่าเหมาะกับการลดอาการส่ายปลายทาง

      max_angular_accel: 1.5
      # ความเร่งเชิงมุมสูงสุดตอนหมุน
      # ถ้าสูงเกินไป หุ่นจะกระชากและเลยมุมง่าย
      # ถ้าต่ำเกินไป จะหมุนช้าแต่เนียนขึ้น

      simulate_ahead_time: 1.0
      # เวลาที่ใช้จำลองการหมุน/การเคลื่อนที่ล่วงหน้าเพื่อประเมินพฤติกรรม
      # ใช้ช่วยให้การควบคุมมีความปลอดภัยและสมเหตุสมผลขึ้น

      rotate_to_goal_heading: true
      # เมื่อเข้าใกล้ goal ในเชิง XY แล้ว
      # ให้ Rotation Shim "กลับมารับงานอีกครั้ง" เพื่อหมุนหุ่นให้ตรง goal heading
      # ถ้า true = shim เป็นคนคุมการหมุนปลายทาง
      # ถ้า false = shim ไม่ยุ่งกับการหมุนปลายทาง

      use_path_orientations: false
      # ถ้า false = ใช้ทิศทางจากรูปทรง path โดยรวม
      # ถ้า true  = ใช้ orientation ของ pose บน path โดยตรง
      # มักเปิด true เมื่อ planner ส่ง path ที่มี orientation ชัดเจนและต้องการใช้มันจริงๆ

      # -----------------------------
      # Regulated Pure Pursuit settings
      # -----------------------------
      desired_linear_vel: 0.5
      # ความเร็วเชิงเส้นหลักที่อยากให้หุ่นวิ่ง
      # ไม่ได้แปลว่าจะวิ่ง 0.5 ตลอดเวลา
      # เพราะ RPP ยังอาจลดความเร็วจากโค้ง, obstacle, และช่วงเข้า goal

      lookahead_dist: 0.6
      # ระยะมองไปข้างหน้าบน path เพื่อเลือก carrot point
      # ใช้ตรงๆ เมื่อ use_velocity_scaled_lookahead_dist = false
      # ค่าน้อย -> เลี้ยวไว ตอบสนองไว แต่มีโอกาสแกว่ง
      # ค่ามาก -> วิ่งนุ่มขึ้น แต่ตัดโค้งกว้างขึ้น

      min_lookahead_dist: 0.3
      # lookahead ต่ำสุดเมื่อใช้โหมด velocity-scaled
      # มีผลจริงเมื่อ use_velocity_scaled_lookahead_dist = true

      max_lookahead_dist: 0.9
      # lookahead สูงสุดเมื่อใช้โหมด velocity-scaled
      # มีผลจริงเมื่อ use_velocity_scaled_lookahead_dist = true

      lookahead_time: 1.5
      # เวลาที่ใช้คำนวณ lookahead แบบอิงความเร็ว
      # มีผลจริงเมื่อ use_velocity_scaled_lookahead_dist = true

      transform_tolerance: 0.1
      # เวลาคลาดเคลื่อนที่ยอมรับได้ของ TF transform
      # ถ้า TF เก่ากว่าค่านี้มาก อาจถูกมองว่าใช้ไม่ได้

      use_velocity_scaled_lookahead_dist: false
      # false = ใช้ lookahead_dist คงที่ตลอด
      # true  = วิ่งเร็ว -> lookahead ไกลขึ้น, วิ่งช้า -> lookahead สั้นลง
      # ตอนนี้คุณปิดไว้ ทำให้จูนง่ายและพฤติกรรมคงที่กว่า

      min_approach_linear_velocity: 0.05
      # ความเร็วเชิงเส้นต่ำสุดตอนใกล้ถึง goal
      # ป้องกันไม่ให้หุ่นชะลอจนแทบไม่ขยับ
      # ถ้าค่านี้สูงไป อาจดัน goal แล้วแกว่งปลายทางได้

      approach_velocity_scaling_dist: 2.0
      # เมื่อเหลือระยะถึง goal ประมาณนี้ จะเริ่มชะลอความเร็วลง
      # ค่ายิ่งมาก -> เริ่มชะลอเร็วขึ้นจากระยะไกล
      # ค่าปัจจุบัน 2.0 ถือว่าค่อนข้างเผื่อการชะลอเยอะ

      use_collision_detection: true
      # เปิด active collision detection
      # RPP จะจำลอง trajectory ล่วงหน้าตามคำสั่งความเร็วปัจจุบัน
      # แล้วตรวจว่าถ้าปล่อยให้ไปต่อจะชนหรือไม่

      max_allowed_time_to_collision_up_to_carrot: 1.0
      # เวลาสูงสุดที่ใช้จำลองไปข้างหน้าเพื่อตรวจชน
      # ค่ายิ่งมาก = มองไกลล่วงหน้ามากขึ้น
      # แต่อาจระวังมากเกินจนชะลอ/หยุดง่าย
      # เอกสารอธิบายว่าระบบจะ project การเคลื่อนที่ไปข้างหน้าตามความเร็วปัจจุบัน
      # แล้วตรวจ collision ในช่วงเวลานี้หรือก่อนถึง lookahead point :contentReference[oaicite:1]{index=1}

      use_regulated_linear_velocity_scaling: true
      # เปิดการลดความเร็วตามความโค้งของ path
      # ถ้าทางโค้งมาก -> ช้าลง
      # ช่วยลด overshoot และช่วยให้เข้าโค้งแม่นขึ้น

      use_cost_regulated_linear_velocity_scaling: true
      # เปิดการลดความเร็วตาม costmap
      # ถ้าใกล้กำแพง/สิ่งกีดขวาง -> ช้าลง
      # เหมาะกับทางแคบหรือวิ่งใกล้วัตถุบ่อย

      regulated_linear_scaling_min_radius: 0.9
      # ถ้ารัศมีเลี้ยวต่ำกว่าค่านี้
      # ระบบจะเริ่มมองว่า "โค้งพอที่จะควรลดความเร็ว"
      # ค่ายิ่งเล็ก -> ยอมให้โค้งมากโดยยังไม่ชะลอ
      # ค่ายิ่งใหญ่ -> ชะลอเร็วขึ้นเมื่อเริ่มเข้าโค้ง

      regulated_linear_scaling_min_speed: 0.25
      # ความเร็วต่ำสุดที่ระบบยอมลดลงเมื่อใช้ regulation จากความโค้ง
      # เป็นพื้นล่างของการชะลอจาก path curvature

      use_fixed_curvature_lookahead: false
      # false = ใช้ระบบ lookahead ปกติในการคำนวณ curvature
      # true  = ใช้ระยะเฉพาะจาก curvature_lookahead_dist เพื่อดูความโค้ง
      # มีประโยชน์เมื่ออยากแยก "ระยะมองเพื่อตาม path" ออกจาก "ระยะมองเพื่อประเมินความโค้ง"

      curvature_lookahead_dist: 2.0
      # ระยะที่ใช้ดู curvature เมื่อเปิด use_fixed_curvature_lookahead = true
      # ตอนนี้ตั้งไว้แต่ยังไม่มีผล เพราะด้านบนเป็น false

      use_rotate_to_heading: false
      # ปิดการหมุนเข้าหา heading ของ RPP
      # เพราะตอนนี้ให้ Rotation Shim เป็นคนรับหน้าที่หมุนแทน
      # แบบนี้ช่วยลดการแย่งกันหมุนระหว่าง shim กับ RPP

      rotate_to_heading_min_angle: 0.785
      # ถ้าเปิด use_rotate_to_heading = true
      # RPP จะเริ่มพิจารณาหมุนเมื่อมุมต่างเกินค่านี้
      # ตอนนี้ยังเก็บไว้ได้ แต่ยังไม่มีผลเพราะปิดอยู่

      max_robot_pose_search_dist: 10.0
      # ระยะสูงสุดบน path ที่ controller จะค้นหาจุดที่ใกล้ robot ที่สุด
      # ใช้จำกัดการค้นหา pose อ้างอิงบน path
      # ค่าสูงช่วยให้รับ path ยาวได้ แต่ไม่ควรสูงเกินความจำเป็นมาก

      interpolate_curvature_after_goal: false
      # ใช้ช่วยประมาณ curvature หลัง goal เพื่อให้ปลายทางนิ่งขึ้น
      # มีประโยชน์บางกรณี โดยเฉพาะร่วมกับ fixed curvature lookahead
      # ตอนนี้ปิดไว้ก่อนเพื่อให้พฤติกรรมเรียบง่าย

      cost_scaling_dist: 0.3
      # ระยะจาก obstacle ที่เริ่มใช้ logic ลดความเร็วตาม costmap
      # ควรสัมพันธ์กับ inflation radius ของ local costmap
      # ถ้าตั้งใหญ่เกินไป หุ่นจะเริ่มชะลอตั้งแต่ยังไกล

      cost_scaling_gain: 1.0
      # ความแรงของการชะลอตาม cost
      # โดยทั่วไปค่ายิ่งต่ำ -> ชะลอแรงขึ้น
      # ค่ายิ่งสูง -> ชะลอน้อยลง
      # ใช้คู่กับ cost_scaling_dist

      inflation_cost_scaling_factor: 3.0
      # ต้องสอดคล้องกับ inflation layer ใน local costmap
      # RPP ใช้ค่านี้แปลง cost กลับไปเป็นระยะโดยประมาณ
      # ถ้าค่านี้ไม่สัมพันธ์กับ costmap จริง พฤติกรรมชะลอใกล้วัตถุอาจเพี้ยนได้

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # robot_radius: 0.22
      footprint: "[[0.215, 0.20], [0.215, -0.20], [-0.215, -0.20], [-0.215, 0.20]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      # robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.215, 0.20], [0.215, -0.20], [-0.215, -0.20], [-0.215, 0.20]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3
      always_send_full_costmap: True

