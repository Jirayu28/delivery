slam_toolbox:
  ros__parameters:
    use_sim_time: false

    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    scan_topic: /scan

    max_laser_range: 6.0

    throttle_scans: 3
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    mode: mapping

    resolution: 0.04          # เริ่มนิ่งก่อน แล้วค่อยลดเป็น 0.03

    minimum_time_interval: 0.20
    minimum_travel_distance: 0.06
    minimum_travel_heading: 0.06   # ~4.5°

    use_scan_matching: true
    use_smoothing: true
    do_loop_closing: true
    loop_search_maximum_distance: 3.0

    enable_interactive_mode: false
